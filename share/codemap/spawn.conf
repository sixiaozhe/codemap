# codemap 线程/回调 API 表
#
# 格式:   名称 [参数序号]     # 序号从 0 起; 省略或写 -1 = 自动扫描所有参数
# 作用:   把这些"通过函数指针启动"的调用识别为依赖边(橙色虚线)
#
# 内置已包含(无需重复):
#   pthread_create(2)  thrd_create(1)  CreateThread(2)  _beginthreadex(2)
#   CreateRemoteThread(3)  signal(1)  atexit(0)
#   pthreadSpawn(-1)  pthreadSpawn_ex(-1)
#   HPR_ThreadDetached_Create(-1)  HPR_Thread_Create(-1)
#   std::thread / std::jthread / std::async (自动识别)
#
# 在此追加你们平台/项目特有的线程创建接口, 每行一个。例如:
#   MyThread_Start   2
#   osTaskCreate     3
#   xTaskCreate      -1
#
# 注: 序号 -1 时会扫描该调用的所有参数, 只要某个参数是项目内已定义的函数名,
#     就建立一条依赖边, 适合签名不确定的情况。
